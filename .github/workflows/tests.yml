name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['12', '13']
        filament: ['4', '5']
        dependencies: [lowest, highest]
        exclude:
          # Pest 5 needs PHP 8.4 and only resolves on Laravel 13, so the 8.3 legs
          # run Pest 4. Testing every cell twice over adds no signal.
          - php: '8.3'
            laravel: '13'

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · Filament ${{ matrix.filament }} · ${{ matrix.dependencies }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, sqlite3, pdo_sqlite
          coverage: pcov

      - name: Constrain Laravel and Filament
        run: |
          composer require --no-update --no-interaction \
            "illuminate/support:^${{ matrix.laravel }}.0" \
            "illuminate/database:^${{ matrix.laravel }}.0" \
            "illuminate/contracts:^${{ matrix.laravel }}.0" \
            "illuminate/console:^${{ matrix.laravel }}.0" \
            "illuminate/broadcasting:^${{ matrix.laravel }}.0" \
            "filament/filament:^${{ matrix.filament }}.0"

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      # TIA is a local convenience and deliberately absent here: it would need a
      # shared baseline, and CI should run every test every time regardless.
      - name: Tests
        run: vendor/bin/pest --colors=always --coverage --min=100

  quality:
    runs-on: ubuntu-latest
    name: Lint, static analysis and types

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, sqlite3, pdo_sqlite
          coverage: pcov

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Rector
        run: vendor/bin/rector --dry-run --no-progress-bar

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Type coverage
        run: vendor/bin/pest --type-coverage --min=100
